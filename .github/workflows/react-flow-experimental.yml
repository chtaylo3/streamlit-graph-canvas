name: React Flow experimental (stable React)

on:
  pull_request:
    paths:
      - 'packages/core/**'
      - 'tests/e2e/**'
      - 'ci/**'
      - '.github/workflows/react-flow-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-flow-experimental-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  experimental:
    name: Experimental React Flow / stable React (${{ matrix.contrib-set }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        contrib-set: [transports, multi-canvas]
    env:
      CI: 'true'
      SGC_CONTRIB_SET: ${{ matrix.contrib-set }}
      SGC_CSP_PROXY: ${{ matrix.contrib-set == 'transports' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: uv sync --locked
      - name: Select experimental React Flow with stable companions and locked tools
        run: >-
          uv run python ci/run_compatibility.py frontend
          --lane forward --scenario react-flow-stable
          --output-tree "${{ runner.temp }}/experimental-core"
          --output experimental-frontend.json
      - run: uv build "${{ runner.temp }}/experimental-core" --out-dir experimental-wheels
      - run: uv build --package streamlit-graph-canvas-contrib --out-dir experimental-wheels
      - run: uv build tests/e2e/fixtures/javascript-renderer --out-dir experimental-wheels
      - name: Verify exact candidate wheel contents and licensing
        env:
          SGC_CANDIDATE: ${{ runner.temp }}/experimental-core
          SGC_AUDIT: ${{ runner.temp }}/license-audit
        run: |
          uv run python - <<'PY'
          import os, shutil
          from pathlib import Path
          from ci.verify_wheels import inspect_wheel, verify_public_imports, verify_versions
          verify_public_imports(Path.cwd())
          verify_versions(Path.cwd())
          audit = Path(os.environ['SGC_AUDIT'])
          target = audit / 'packages/core/src/streamlit_graph_canvas/frontend/build/third-party-licenses.json'
          target.parent.mkdir(parents=True)
          shutil.copyfile(Path(os.environ['SGC_CANDIDATE']) / 'src/streamlit_graph_canvas/frontend/build/third-party-licenses.json', target)
          for wheel in Path('experimental-wheels').glob('streamlit_graph_canvas*.whl'):
              print(inspect_wheel(wheel, audit))
          PY
      - run: >-
          uv run python -m ci.build_conformance_environment
          --set "${{ matrix.contrib-set }}"
          --wheelhouse experimental-wheels
          --venv "${{ runner.temp }}/experimental-browser"
          --output experimental-browser.json
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npm test
        working-directory: tests/e2e
        env:
          SGC_CONFORMANCE_PYTHON: ${{ runner.temp }}/experimental-browser/bin/python
      - if: matrix.contrib-set == 'transports'
        run: npm run test:features
        working-directory: tests/e2e
        env:
          SGC_CONFORMANCE_PYTHON: ${{ runner.temp }}/experimental-browser/bin/python
      - if: always()
        run: |
          echo '### Experimental React Flow / stable React (${{ matrix.contrib-set }}): ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Experimental results do not promote React Flow v13 support. See the dependency/build report and browser artifacts for the tested versions and failures.' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: react-flow-stable-${{ matrix.contrib-set }}
          path: |
            experimental-*.json
            tests/e2e/test-results/
            tests/e2e/playwright-report/
            tests/e2e/artifacts/
          if-no-files-found: warn
          retention-days: 30
