name: Candidate compatibility (advisory)

on:
  schedule:
    - cron: '43 9 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'uv.lock'
      - '**/package*.json'
      - '**/pyproject.toml'
      - 'ci/**'
      - '.github/workflows/candidate-compatibility.yml'

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  latest-tested:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        surface: [python, frontend, browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: '3.12'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: uv sync --locked
      - name: Evaluate aged candidates or retain approved baselines
        id: probe
        env:
          SURFACE: ${{ matrix.surface }}
        run: |
          if [ "$SURFACE" = python ]; then
            echo "stage=python-probe" >> "$GITHUB_OUTPUT"
            uv run python ci/run_compatibility.py python --lane latest-tested --python 3.12 --venv "$RUNNER_TEMP/candidate-python" --output candidate.json
          elif [ "$SURFACE" = frontend ]; then
            echo "stage=frontend-probe" >> "$GITHUB_OUTPUT"
            uv run python ci/run_compatibility.py frontend --lane latest-tested --output candidate.json
          else
            echo "stage=frontend-probe" >> "$GITHUB_OUTPUT"
            uv run python ci/run_compatibility.py frontend --lane latest-tested --output-tree "$RUNNER_TEMP/candidate-core" --output candidate.json
            echo "stage=wheel-build" >> "$GITHUB_OUTPUT"
            uv build "$RUNNER_TEMP/candidate-core" --out-dir candidate-wheels
            uv build --package streamlit-graph-canvas-contrib --out-dir candidate-wheels
            uv build tests/e2e/fixtures/javascript-renderer --out-dir candidate-wheels
            echo "stage=python-environment" >> "$GITHUB_OUTPUT"
            uv run python -m ci.build_conformance_environment --set transports --dependency-lane latest-tested --wheelhouse candidate-wheels --venv "$RUNNER_TEMP/candidate-browser" --output candidate-browser.json
            echo "stage=browser-tools" >> "$GITHUB_OUTPUT"
            cd tests/e2e
            npm ci
            npx playwright install --with-deps chromium
            echo "stage=browser-tests" >> "$GITHUB_OUTPUT"
            CI=true SGC_CONTRIB_SET=transports SGC_CSP_PROXY=true SGC_CONFORMANCE_PYTHON="$RUNNER_TEMP/candidate-browser/bin/python" npm test
          fi
      - if: always()
        name: Report candidate outcome without promoting support
        env:
          OUTCOME: ${{ steps.probe.outcome }}
          SURFACE: ${{ matrix.surface }}
          STAGE: ${{ steps.probe.outputs.stage }}
        run: >-
          python ci/report_candidate_outcome.py
          --surface "$SURFACE" --outcome "$OUTCOME" --stage "$STAGE"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latest-tested-${{ matrix.surface }}
          path: |
            candidate*.json
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 30
