name: CI

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv build --package streamlit-graph-canvas
      - run: uv build --package streamlit-graph-canvas-contrib

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core/src/streamlit_graph_canvas/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/core/src/streamlit_graph_canvas/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
