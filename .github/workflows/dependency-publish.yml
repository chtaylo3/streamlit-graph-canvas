name: Publish prepared dependency files

# Intentional privilege separation: only default-branch code runs here. Artifacts
# are parsed as bounded data; PR code is never checked out or executed.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Prepare dependency PR]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: dependency-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate result with read-only credentials
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARATION_BOT: ${{ vars.DEPENDENCY_PREPARATION_BOT }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python3 -m ci.publish_dependency_pr --run "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT"
      - name: Mint narrowly scoped publication token
        if: vars.DEPENDENCY_PREPARATION_WRITE == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPENDENCY_PREPARATION_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_PREPARATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read
          permission-actions: read
      - name: Commit validated files to the existing PR
        if: vars.DEPENDENCY_PREPARATION_WRITE == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PREPARATION_BOT: ${{ vars.DEPENDENCY_PREPARATION_BOT }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python3 -m ci.publish_dependency_pr --run "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT" --commit
