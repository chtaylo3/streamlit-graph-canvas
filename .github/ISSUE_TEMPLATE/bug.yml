name: Bug report
description: Report a reproducible defect in core, contrib, or conformance.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include any SGC diagnostic code and browser console output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Core, contrib, Streamlit, Python, browser, and operating system.
    validations:
      required: true
