[project]
name = "streamlit-graph-canvas-workspace"
version = "0.1.0.dev0"
description = "Development workspace for streamlit-graph-canvas and its renderer ecosystem."
requires-python = ">=3.12"
dependencies = [
    "streamlit-graph-canvas",
    "streamlit-graph-canvas-contrib",
]

[tool.uv]
package = false

[tool.uv.sources]
streamlit-graph-canvas = { workspace = true }
streamlit-graph-canvas-contrib = { workspace = true }

[tool.uv.workspace]
members = ["packages/core", "packages/contrib"]

[dependency-groups]
dev = [
    "hypothesis>=6.0.0",
    "mypy>=2.3.1",
    "networkx>=3.6.1",
    "pip-audit>=2.9.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/core/tests", "packages/contrib/tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
