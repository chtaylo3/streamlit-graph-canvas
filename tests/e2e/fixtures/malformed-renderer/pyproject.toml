[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "scg-malformed-renderer-fixture"
version = "0.1.0"
description = "Deliberately malformed unrequested renderer for conformance tests."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["streamlit-graph-canvas>=0.1.0.dev0,<0.2"]

[project.entry-points."streamlit_graph_canvas.renderers"]
fixture = "scg_malformed_renderer:renderer_manifest"

[tool.uv.build-backend]
module-name = "scg_malformed_renderer"
