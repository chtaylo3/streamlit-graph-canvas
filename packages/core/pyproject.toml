[build-system]
requires = ["uv_build>=0.12.6,<0.14"]
build-backend = "uv_build"

[project]
name = "streamlit-graph-canvas"
version = "0.1.0rc3"
description = "A domain-neutral, schema-driven graph canvas for Streamlit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.12"
dependencies = ["packaging>=26.0", "streamlit>=1.66.1"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.optional-dependencies]
atlas = ["Pillow>=13.0.0,<14"]
networkx = ["networkx>=3.6.1"]
# API only, never the SDK: the application owns provider configuration.
otel = ["opentelemetry-api>=1.30,<2"]

[project.urls]
Documentation = "https://github.com/chtaylo3/streamlit-graph-canvas"
Repository = "https://github.com/chtaylo3/streamlit-graph-canvas"

[tool.uv.build-backend]
module-name = "streamlit_graph_canvas"
source-exclude = ["frontend/node_modules"]
wheel-exclude = [
    "frontend/src",
    "frontend/package.json",
    "frontend/package-lock.json",
    "frontend/tsconfig.json",
    "frontend/vite.config.ts",
]
